name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build library + CLI
        run: dotnet build GodotOnnx.sln --configuration Release

      - name: Build Godot demo
        run: dotnet build godot/Demo.csproj --configuration Release

      # Note: model-dependent verification (compare / synth / smoke test) requires
      # models/ assets + dictionaries which are not part of this repository.
