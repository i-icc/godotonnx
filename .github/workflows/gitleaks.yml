name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scan every commit, not just the latest snapshot

      # Uses the gitleaks CLI directly (same tool as the local .githooks/pre-commit hook).
      # No artifacts are created: the gitleaks-action's report upload can break on
      # accounts whose Action storage quota is full, even when the scan itself passes.
      - name: Download gitleaks
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          chmod +x gitleaks
          ./gitleaks version
        env:
          VERSION: 8.30.1

      - name: Scan full history
        run: ./gitleaks detect --source . --redact --verbose
